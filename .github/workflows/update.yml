name: Update Outage Data

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      skip_parser:
        description: 'Skip scraping ZOE (used when Home Assistant just pushed updated JSON)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

concurrency:
  group: update-outage-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python -m unittest discover -s tests -v

      - name: Run parser
        if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.skip_parser) }}
        run: python scripts/parser.py

      - name: Render schedule images
        if: github.event_name != 'pull_request'
        run: python scripts/render_png.py --json data/Zaporizhzhiaoblenergo.json --out images/Zaporizhzhiaoblenergo

      - name: Commit and push if changed
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ images/
          if git diff --staged --quiet; then
            echo "No changes in data or images."
          else
            echo "Changes detected. Committing..."
            git commit -m "Update $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            if ! git pull --rebase origin main; then
              echo "Rebase conflict detected (likely concurrent HA push); rebasing PNGs on latest remote JSON..."
              git rebase --abort || true
              git fetch origin main
              echo "::warning::Discarding local parser commit in favour of remote (HA push):"
              git diff --stat origin/main HEAD -- data/ images/ || true
              git reset --hard origin/main
              python scripts/render_png.py --json data/Zaporizhzhiaoblenergo.json --out images/Zaporizhzhiaoblenergo
              git add -A data/ images/
              if ! git diff --staged --quiet; then
                git commit -m "Update $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              fi
            fi
            git push
          fi
