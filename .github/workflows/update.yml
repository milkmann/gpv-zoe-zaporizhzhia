name: Update Outage Data

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install matplotlib

      - name: Run parser
        run: |
          python scripts/parser.py

      - name: Render schedule images
        run: |
          python scripts/render_png.py --json data/Zaporizhzhiaoblenergo.json --out images/Zaporizhzhiaoblenergo

      - name: Commit and push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ images/
          if git diff --staged --quiet; then
            echo "No changes in data or images."
          else
            echo "Changes detected. Committing..."
            git commit -m "Update $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
